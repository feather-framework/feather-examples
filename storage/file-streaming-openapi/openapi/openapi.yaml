openapi: 3.0.0
info:
  title: Dummy File Streaming API
  description: Minimal example API for streaming upload/download.
  version: 1.0.0
tags:
- name: FileStreaming
servers:
- url: https://api.example.com
paths:
  /upload:
    put:
      tags:
      - FileStreaming
      summary: Upload file as a chunked stream
      operationId: streamUpload
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            example: hello world
        required: true
      responses:
        201:
          description: Chunk accepted
          headers:
            Transfer-Encoding:
              required: true
              schema:
                $ref: '#/components/schemas/TransferEncodingHeaderValueSchema'
              description: Uses chunked transfer for streaming response data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  receivedBytes:
                    type: integer
                    default: null
                    example: null
                required:
                - receivedBytes
  /download:
    get:
      tags:
      - FileStreaming
      summary: Download file as a chunked stream
      operationId: streamDownload
      responses:
        200:
          description: Chunked stream response
          headers:
            Transfer-Encoding:
              required: true
              schema:
                $ref: '#/components/schemas/TransferEncodingHeaderValueSchema'
              description: Uses chunked transfer for streaming response data.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  schemas:
    TransferEncodingHeaderValueSchema:
      type: string
      enum:
      - chunked
      default: null
      example: null
  examples:
    chunkSample:
      summary: Single chunk payload example
      value: hello world
